<svg xmlns="http://www.w3.org/2000/svg" width="144" height="140" viewBox="0 0 144 140" fill="none">
  <defs>
    <radialGradient id="glow-tracesearch" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="topglow-tracesearch" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0" />
      <stop offset="20%" stop-color="#2dd4bf" stop-opacity="0.8" />
      <stop offset="80%" stop-color="#2dd4bf" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Ambient Glow Behind Logo -->
  <circle cx="72" cy="48" r="38" fill="url(#glow-tracesearch)" />

  <!-- Card Background Surface (#161b22) -->
  <rect x="2" y="2" width="140" height="136" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1.5" />

  <!-- Top Accent Bar -->
  <rect x="14" y="2" width="116" height="2.5" rx="1.25" fill="url(#topglow-tracesearch)" />

  <!-- Logo Container (#21262d) -->
  <rect x="47" y="20" width="50" height="50" rx="12" fill="#21262d" stroke="#30363d" stroke-width="1.2" />

  <!-- Project Logo (Uniform 38x38 Size) -->
  <image x="53" y="26" width="38" height="38" href="data:image/png;base64," />

  <!-- Project Name -->
  <text x="72" y="93.5" fill="#F0F6FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" letter-spacing="-0.2" text-anchor="middle">TraceSearch</text>

  <!-- Category Pill Badge -->
  <rect x="37.5" y="104" width="69.0" height="18" rx="9" fill="#21262d" fill-opacity="0.85" stroke="#30363d" stroke-width="0.8" />
  <text x="72" y="116.5" fill="#2dd4bf" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" text-anchor="middle">AI Research</text>
</svg>