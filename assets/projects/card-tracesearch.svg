<svg xmlns="http://www.w3.org/2000/svg" width="268" height="82" viewBox="0 0 268 82" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-tracesearch" x1="4" y1="4" x2="264" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <!-- Border Gradient with Subtle Brand Accent Highlight -->
    <linearGradient id="border-tracesearch" x1="4" y1="4" x2="264" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.65" />
      <stop offset="35%" stop-color="#30363d" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#21262d" stop-opacity="0.5" />
    </linearGradient>

    <!-- Top Glow -->
    <linearGradient id="topglow-tracesearch" x1="4" y1="4" x2="264" y2="4" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.35" />
      <stop offset="45%" stop-color="#2DD4BF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0" />
    </linearGradient>

    <!-- Logo Ambient Backlight -->
    <radialGradient id="logoglow-tracesearch" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Card Base -->
  <rect x="4.5" y="4.5" width="259" height="73" rx="14" fill="url(#bg-tracesearch)" stroke="url(#border-tracesearch)" stroke-width="1" />

  <!-- Top Ambient Glow Line -->
  <rect x="5" y="5" width="258" height="2.5" rx="1.25" fill="url(#topglow-tracesearch)" />

  <!-- Logo Backlight Glow -->
  <circle cx="41" cy="41" r="26" fill="url(#logoglow-tracesearch)" />

  <!-- Logo Container -->
  <rect x="18" y="18" width="46" height="46" rx="11" fill="#21262d" stroke="#30363d" stroke-width="1" />
  <image x="22" y="22" width="38" height="38" href="data:image/png;base64," />

  <!-- Text Group -->
  <!-- Project Title -->
  <text x="72" y="35" fill="#F0F6FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" letter-spacing="-0.2">TraceSearch</text>

  <!-- Accent Status Dot -->
  <circle cx="76" cy="51.5" r="3" fill="#2DD4BF" />

  <!-- Subtitle -->
  <text x="84" y="55" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11" font-weight="400">Autonomous AI Research Engine</text>

  <!-- Top-Right Action Arrow Badge -->
  <g transform="translate(240, 18)">
    <circle cx="5" cy="5" r="7.5" fill="#21262d" fill-opacity="0.8" stroke="#30363d" stroke-width="0.8" />
    <path d="M3.2 6.8L6.8 3.2M6.8 3.2H4.4M6.8 3.2V5.6" stroke="#2DD4BF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>