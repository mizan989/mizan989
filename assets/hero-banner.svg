<svg xmlns="http://www.w3.org/2000/svg" width="860" height="96" viewBox="0 0 860 96" role="img" aria-label="Md Mizan — Full-Stack &amp; Generative Systems Engineer">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#111622"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="25%" stop-color="#58a6ff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#39d353" stop-opacity="0.9"/>
      <stop offset="75%" stop-color="#8957e5" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8957e5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f0f6fc"/>
      <stop offset="100%" stop-color="#79c0ff"/>
    </linearGradient>
  </defs>

  <!-- Container Base -->
  <rect x="0.5" y="0.5" width="859" height="95" rx="10" fill="url(#bannerBg)" stroke="#30363d" stroke-width="1"/>

  <!-- Top Ambient Glow Beam -->
  <line x1="12" y1="1" x2="848" y2="1" stroke="url(#accentLine)" stroke-width="1.8"/>

  <!-- Centered Identity -->
  <text x="430" y="47" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="28" font-weight="800" fill="url(#textGrad)" letter-spacing="2">MD MIZAN</text>
  <text x="430" y="73" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#8b949e" letter-spacing="1.5">FULL-STACK &amp; GENERATIVE SYSTEMS ENGINEER</text>
</svg>
